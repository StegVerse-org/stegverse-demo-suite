name: Deploy SV-DN-1 Public Dashboard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-sv-dn1-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sv-dn1-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static public artifacts without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce static-hosting authority boundary
        run: python -m unittest tests.test_sv_dn1_public_pages_contract

      - name: Read existing GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload checked-in static public artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy static dashboard
        id: deployment
        uses: actions/deploy-pages@v4
